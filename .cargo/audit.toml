[advisories]
ignore = [
  # Tauri's Linux-only GTK3/WebKit dependency graph. Fruitboard supports
  # Windows in Phase 1; revisit every Tauri upgrade and before adding Linux.
  "RUSTSEC-2024-0370",
  "RUSTSEC-2024-0411",
  "RUSTSEC-2024-0412",
  "RUSTSEC-2024-0413",
  "RUSTSEC-2024-0414",
  "RUSTSEC-2024-0415",
  "RUSTSEC-2024-0416",
  "RUSTSEC-2024-0417",
  "RUSTSEC-2024-0418",
  "RUSTSEC-2024-0419",
  "RUSTSEC-2024-0420",
  "RUSTSEC-2024-0429",

  # Unmaintained Unicode helper crates pulled in by Tauri's urlpattern crate.
  # They are not direct Fruitboard dependencies; revisit every Tauri upgrade.
  "RUSTSEC-2025-0075",
  "RUSTSEC-2025-0080",
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0098",
  "RUSTSEC-2025-0100",
]

[output]
deny = ["warnings"]
format = "terminal"
quiet = false
show_tree = true
