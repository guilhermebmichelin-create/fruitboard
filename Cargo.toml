[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/foundation-sidecar-smoke",
  "crates/filesystem-watcher",
  "crates/storage-sqlite",
  "crates/reconciliation",
  "crates/filesystem-enumeration",
  "crates/scan-execution",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"

[workspace.dependencies]
fruitboard-storage = { path = "crates/storage-sqlite" }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = [] }
tauri-build = { version = "=2.6.3", features = [] }
tauri-plugin-shell = { version = "=2.3.6" }
tauri-plugin-dialog = { version = "=2.7.3", default-features = false }
uuid = { version = "=1.26.0", features = ["v7"] }
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Threading",
] }
