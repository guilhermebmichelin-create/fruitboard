[workspace]
members = ["apps/desktop/src-tauri", "crates/storage-sqlite"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"

[workspace.dependencies]
fruitboard-storage = { path = "crates/storage-sqlite" }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = [] }
tauri-build = { version = "=2.6.3", features = [] }
uuid = { version = "=1.26.0", features = ["v7"] }
