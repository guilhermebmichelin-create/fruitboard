[package]
name = "fruitboard-desktop"
version = "0.1.0"
description = "Fruitboard desktop application host"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
packaging-smoke = ["dep:tauri-plugin-shell", "dep:fruitboard-flp-parser"]
# Explicit development composition; default builds still read no FLP contents.
analysis-jobs = ["scan-console", "packaging-smoke", "dep:fruitboard-analysis-execution", "dep:fruitboard-sample-presence", "fruitboard-storage/analysis-jobs"]
# Hidden scan-console IPC: commands are always registered, but the host wiring
# and worker thread only exist with this feature enabled. Default builds must
# not compile the scanner crates at all.
scan-console = [
  "dep:fruitboard-scan-execution",
  "dep:fruitboard-filesystem-enumeration",
  "dep:fruitboard-filesystem-watcher",
]

[lib]
name = "fruitboard_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
fruitboard-flp-parser = { path = "../../../crates/flp-parser", optional = true }
fruitboard-analysis-execution = { path = "../../../crates/analysis-execution", optional = true }
fruitboard-sample-presence = { path = "../../../crates/sample-presence", optional = true }
fruitboard-storage.workspace = true
fruitboard-scan-execution = { path = "../../../crates/scan-execution", optional = true }
fruitboard-filesystem-enumeration = { path = "../../../crates/filesystem-enumeration", optional = true }
fruitboard-filesystem-watcher = { path = "../../../crates/filesystem-watcher", optional = true }
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog = { workspace = true }
tauri-plugin-shell = { workspace = true, optional = true }
uuid.workspace = true
