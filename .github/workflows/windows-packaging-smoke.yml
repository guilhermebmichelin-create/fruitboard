name: Windows Packaging Smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/windows-packaging-smoke.yml"
      - "apps/desktop/**"
      - "apps/client/**"
      - "crates/**"
      - "packages/**"
      - "scripts/prepare-foundation-sidecar.mjs"
      - "scripts/probe-webview-audio.mjs"
      - "scripts/run-windows-foundation-smoke.mjs"
      - "scripts/windows-foundation-smoke.ps1"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tools/toolchain-policy.json"
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  windows-packaging-smoke:
    name: windows-packaging-smoke
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
      - name: Enable pinned pnpm
        run: |
          npm.cmd install --global corepack@0.36.0
          corepack.cmd enable
          corepack.cmd install
      - name: Locate pnpm store
        id: pnpm-store
        shell: pwsh
        run: '"path=$(pnpm.cmd store path --silent)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append'
      - name: Restore pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Set up pinned Rust
        run: |
          rustup set profile minimal
          rustup toolchain install 1.98.1 --component clippy,rustfmt --target x86_64-pc-windows-msvc --no-self-update
          rustup default 1.98.1
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-packaging-${{ hashFiles('Cargo.lock') }}
      - name: Install locked dependencies
        run: pnpm.cmd install --frozen-lockfile --ignore-scripts
      - name: Build, install, launch, and uninstall the development package
        run: pnpm.cmd smoke:windows:foundation:hosted
