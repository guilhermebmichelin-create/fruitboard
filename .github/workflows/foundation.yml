name: Foundation CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  docs-policy:
    name: docs-policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
      - name: Enable pinned pnpm
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          corepack install
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify repository privacy
        run: pnpm privacy:check
      - name: Lint documentation and policies
        run: |
          pnpm lint:docs
          pnpm lint:scripts
          node --test "tests/*.test.mjs"

  client:
    name: client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
      - name: Enable pinned pnpm
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          corepack install
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check shared client
        run: |
          pnpm --recursive --if-present lint
          pnpm --recursive --if-present typecheck
          pnpm --recursive --if-present test
          pnpm --filter @fruitboard/client build

  rust-portable:
    name: rust-portable
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pinned Rust
        run: |
          rustup set profile minimal
          rustup toolchain install 1.98.1 --component clippy,rustfmt --no-self-update
          rustup default 1.98.1
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-portable-${{ hashFiles('Cargo.lock') }}
      - name: Check portable storage crate
        run: |
          cargo fmt --all --check
          cargo clippy -p fruitboard-storage --all-targets --locked -- -D warnings
          cargo test -p fruitboard-storage --locked
          cargo clippy -p fruitboard-reconciliation --all-targets --locked -- -D warnings
          cargo test -p fruitboard-reconciliation --locked

  migration:
    name: migration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pinned Rust
        run: |
          rustup set profile minimal
          rustup toolchain install 1.98.1 --no-self-update
          rustup default 1.98.1
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-migration-${{ hashFiles('Cargo.lock') }}
      - name: Exercise migration and recovery boundaries
        run: |
          cargo test -p fruitboard-storage --locked creates_latest_and_reopens_without_reseeding_settings
          cargo test -p fruitboard-storage --locked upgrades_every_supported_fixture_and_preserves_existing_rows
          cargo test -p fruitboard-storage --locked durable_scan_jobs_coalesce_and_schedule_one_follow_up
          cargo test -p fruitboard-storage --locked execution_finish_transition_matrix_covers_outcomes_followups_and_cancellation
          cargo test -p fruitboard-storage --locked execution_recovery_transition_matrix_covers_restart_and_backup
          cargo test -p fruitboard-storage --locked worker_cancelled_outcome_suppresses_followup_on_restart_and_backup_recovery
          cargo test -p fruitboard-storage --locked exhausted_worker_failure_chain_is_not_recovered_by_diagnostic
          cargo test -p fruitboard-storage --locked restart_requeues_the_interrupted_attempt_without_resetting_its_chain
          cargo test -p fruitboard-storage --locked repeated_active_restarts_exhaust_one_persisted_retry_chain
          cargo test -p fruitboard-storage --locked pending_follow_up_survives_restart_and_invalidates_the_resumed_attempt
          cargo test -p fruitboard-storage --locked pending_follow_up_is_suppressed_by_cancellation_disable_and_removal
          cargo test -p fruitboard-storage --locked disabling_and_removing_roots_invalidate_work_and_readding_gets_new_identity
          cargo test -p fruitboard-storage --locked staging_is_invisible_until_atomic_publication_and_tracks_aliases
          cargo test -p fruitboard-storage --locked publication_marks_missing_and_restores_each_alias_without_collapsing_it
          cargo test -p fruitboard-storage --locked publication_rejects_stale_or_cancelled_runs_without_touching_committed_rows
          cargo test -p fruitboard-storage --locked publication_rolls_back_visible_rows_and_ledger_on_apply_failure
          cargo test -p fruitboard-storage --locked recovery_discards_open_staging_and_root_removal_detaches_history
          cargo test -p fruitboard-storage --locked staging_batches_enforce_record_and_path_budgets_before_writing
          cargo test -p fruitboard-storage --locked killed_migration_recovers_the_original_committed_database
          cargo test -p fruitboard-storage --locked backup_recovers_committed_state_after_original_corruption_without_overwriting_it

  windows-foundation:
    name: windows-foundation
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.9
          enable-cache: false
      - name: Set up pinned Python environment
        run: |
          uv python install 3.11.16
          uv sync --frozen --python 3.11.16
      - name: Enable pinned pnpm
        run: |
          npm.cmd install --global corepack@0.36.0
          corepack.cmd enable
          corepack.cmd install
      - name: Locate pnpm store
        id: pnpm-store
        shell: pwsh
        run: '"path=$(pnpm.cmd store path --silent)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append'
      - name: Restore pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Set up pinned Rust
        run: |
          rustup set profile minimal
          rustup toolchain install 1.98.1 --component clippy,rustfmt --target x86_64-pc-windows-msvc --no-self-update
          rustup default 1.98.1
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-windows-${{ hashFiles('Cargo.lock') }}
      - name: Install locked dependencies
        run: pnpm.cmd install --frozen-lockfile --ignore-scripts
      - name: Run the integrated Windows gate
        run: pnpm.cmd check

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
      - name: Enable pinned pnpm
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          corepack install
      - name: Verify privacy and npm advisories
        run: |
          node scripts/verify-repository-privacy.mjs
          pnpm audit --audit-level high
      - name: Set up pinned Rust
        run: |
          rustup set profile minimal
          rustup toolchain install 1.98.1 --no-self-update
          rustup default 1.98.1
      - name: Restore RustSec tool cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-audit-0.22.2-rust-1.98.1
      - name: Install pinned RustSec auditor
        run: |
          if ! cargo-audit --version | grep -Fxq "cargo-audit 0.22.2"; then
            cargo install cargo-audit --locked --version 0.22.2
          fi
      - name: Verify Rust advisories
        run: cargo audit --file Cargo.lock
