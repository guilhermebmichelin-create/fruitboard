name: Dependency Review

# Draft for owner review under issue #148. Merging this file enables the
# GitHub-native dependency review on pull requests; it is not a required check
# and no branch protection is changed here. Dependabot continues to propose the
# weekly update pull requests. The existing lockfile review path and the
# executable baseline (repository privacy gate, `pnpm audit --audit-level
# high`, RustSec/cargo-audit) stay authoritative until the owner validates this
# workflow on a real pull request and records the decision on #148.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
