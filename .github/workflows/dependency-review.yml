# Dependency review, approved from the issue #148 proposal
# (docs/review/security/issue-148-proposal-20260920.md). Informational
# check on pull requests: it is not a required context; branch protection
# is unchanged. The existing lockfile privacy/RustSec checks remain in
# place.
#
# Action SHA provenance (verified 2026-09-29 via the GitHub API):
# - actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
#   = tag v5.0.0 (merge commit, 2026-05-08).
# - actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 is the pin
#   already reviewed and allowlisted for foundation.yml.
name: Dependency Review
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
