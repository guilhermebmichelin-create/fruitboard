# CodeQL advanced setup, approved from the issue #148 proposal
# (docs/review/security/issue-148-proposal-20260920.md). Informational
# check: it is not a required context; branch protection is unchanged.
#
# Action SHA provenance (verified 2026-09-29 via the GitHub API):
# - github/codeql-action@b96794f015dfd88f77b49b1c93e0fa7110f94c63 = tag v4.38.0
#   (annotated tag 4bd7200e1f146b1c937cae12d258b50f41a53cf8 dereferences to it)
# - actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 is the pin
#   already reviewed and allowlisted for foundation.yml.
name: CodeQL
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          category: /language:${{ matrix.language }}
