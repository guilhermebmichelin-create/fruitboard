version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    # @types/node must track the pinned Node 24.20.0 runtime (DEVELOPMENT.md
    # toolchain policy); TypeScript 7 is postponed until typescript-eslint
    # supports it and the Phase 2 checkpoint has passed (owner decision,
    # 2026-09-07).
    ignore:
      - dependency-name: "@types/node"
        versions: [">=25"]
      - dependency-name: "typescript"
        versions: [">=7"]
  - package-ecosystem: cargo
    directory: /
    # LocatorKeyV1 pairs Unicode 17 NFC with its vendored simple-fold table.
    # 0.1.26 uses Unicode 18; upgrade only with a reviewed key-format policy.
    ignore:
      - dependency-name: "unicode-normalization"
        versions: [">=0.1.26"]
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
